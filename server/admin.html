<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio Studio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" />
    <style>
      :root, html[data-theme="dark"] {
        --bg: #080a1a; --bg2: #0d1024; --panel: #131733; --panel2: #1a1f42; --panel3: #222850;
        --line: rgba(148, 163, 255, 0.14); --line2: rgba(148, 163, 255, 0.26);
        --text: #e9ecff; --muted: #8f97c6; --faint: #5f6797;
        --accent: #6366f1; --accent2: #8b5cf6; --cyan: #22d3ee;
        --ok: #34d399; --danger: #f87171; --warn: #fbbf24;
        --shadow: 0 18px 50px -18px rgba(0, 0, 0, 0.7);
        --glow: 0 10px 30px -10px rgba(99, 102, 241, 0.7);
        --bgfx: radial-gradient(900px 500px at 8% -10%, rgba(99, 102, 241, 0.22), transparent 60%), radial-gradient(700px 500px at 100% 0%, rgba(139, 92, 246, 0.16), transparent 60%);
      }
      html[data-theme="light"] {
        --bg: #f3f4fb; --bg2: #ffffff; --panel: #ffffff; --panel2: #f1f3fc; --panel3: #e7eafa;
        --line: rgba(60, 70, 140, 0.12); --line2: rgba(60, 70, 140, 0.24);
        --text: #14173a; --muted: #5d648f; --faint: #98a0c8;
        --accent: #5558e6; --accent2: #7c4ee6; --cyan: #0891b2;
        --ok: #059669; --danger: #dc2626; --warn: #d97706;
        --shadow: 0 18px 50px -22px rgba(40, 50, 120, 0.35);
        --glow: 0 10px 30px -10px rgba(99, 102, 241, 0.5);
        --bgfx: radial-gradient(900px 500px at 8% -10%, rgba(99, 102, 241, 0.12), transparent 60%);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14.5px; line-height: 1.5;
        background: var(--bg); background-image: var(--bgfx); background-attachment: fixed; color: var(--text); -webkit-font-smoothing: antialiased; }
      h1, h2, h3 { font-family: "Space Grotesk", "Inter", sans-serif; margin: 0; letter-spacing: -0.01em; }
      button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
      svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
      ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }

      /* ---------- buttons ---------- */
      .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 11px; font-weight: 600; font-size: 13.5px; transition: transform .15s, background .2s, box-shadow .2s, border-color .2s, opacity .2s; border: 1px solid transparent; white-space: nowrap; }
      .btn:active { transform: scale(0.97); }
      .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
      .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: var(--glow); }
      .btn-primary:hover:not([disabled]) { filter: brightness(1.1); transform: translateY(-1px); }
      .btn-soft { background: var(--panel2); border-color: var(--line); color: var(--text); }
      .btn-soft:hover { border-color: var(--line2); background: var(--panel3); }
      .btn-ghost { color: var(--muted); } .btn-ghost:hover { color: var(--text); background: var(--panel2); }
      .btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: color-mix(in srgb, var(--danger) 8%, transparent); }
      .btn-danger:hover { background: color-mix(in srgb, var(--danger) 18%, transparent); }
      .btn-sm { padding: 6px 10px; font-size: 12.5px; border-radius: 9px; }
      .icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 9px; color: var(--muted); transition: background .15s, color .15s; }
      .icon-btn:hover { background: var(--panel3); color: var(--text); }
      .icon-btn.danger:hover { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
      .icon-btn[disabled] { opacity: .3; pointer-events: none; }

      /* ---------- login ---------- */
      #login { min-height: 100vh; display: none; place-items: center; padding: 24px; }
      .login-card { width: min(400px, 100%); background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: 22px; padding: 34px; box-shadow: var(--shadow); text-align: center; animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
      .logo { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 18px; display: grid; place-items: center; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; font: 700 21px "Space Grotesk", sans-serif; box-shadow: var(--glow); }
      .login-card h1 { font-size: 24px; } .login-card p { color: var(--muted); margin: 6px 0 24px; }
      .pw { position: relative; } .pw input { padding-right: 44px; } .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
      .login-err { color: var(--danger); font-size: 13px; min-height: 20px; margin: 10px 0 0; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } }

      /* ---------- shell ---------- */
      #app { display: none; min-height: 100vh; grid-template-columns: 276px minmax(0, 1fr); }
      aside.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: color-mix(in srgb, var(--bg2) 92%, transparent); border-right: 1px solid var(--line); backdrop-filter: blur(14px); z-index: 40; }
      .brand { display: flex; align-items: center; gap: 12px; padding: 20px 20px 14px; }
      .brand .logo { margin: 0; width: 40px; height: 40px; border-radius: 12px; font-size: 16px; }
      .brand b { display: block; font: 700 16px "Space Grotesk", sans-serif; } .brand span { color: var(--muted); font-size: 12px; }
      .search { margin: 4px 16px 10px; position: relative; } .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); width: 16px; height: 16px; }
      .search input[type=text] { padding-left: 36px; height: 38px; background: var(--panel); }
      .navwrap { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
      .navgroup { margin-bottom: 14px; } .navgroup h4 { margin: 10px 8px 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); display: flex; justify-content: space-between; align-items: center; }
      .navitem { width: 100%; display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 11px; color: var(--muted); font-weight: 500; text-align: left; transition: background .15s, color .15s; position: relative; }
      .navitem:hover { background: var(--panel2); color: var(--text); }
      .navitem.active { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 24%, transparent), color-mix(in srgb, var(--accent2) 14%, transparent)); color: var(--text); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 38%, transparent); }
      .navitem.active svg { color: var(--cyan); }
      .navitem .dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 10px var(--accent2); }
      .navitem .count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
      .legacy-toggle { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; color: var(--faint); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .side-foot { padding: 12px 16px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
      .side-foot .row { display: flex; gap: 8px; }
      main.main { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
      .topbar { display: none; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: color-mix(in srgb, var(--bg2) 92%, transparent); backdrop-filter: blur(14px); z-index: 30; }
      .scrim { display: none; position: fixed; inset: 0; background: rgba(2, 4, 18, .6); z-index: 35; }
      .work { display: flex; flex: 1; min-height: 0; }
      .content { flex: 1; min-width: 0; padding: 0 clamp(16px, 3vw, 40px) 90px; }
      .content-inner { max-width: 880px; margin: 0 auto; min-width: 0; }
      .card, .item, .item-body { min-width: 0; }

      /* ---------- dashboard ---------- */
      .hello { padding: 34px 0 8px; } .hello h1 { font-size: clamp(26px, 3.4vw, 36px); } .hello p { color: var(--muted); margin: 8px 0 0; max-width: 620px; }
      .hello-actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
      .tips { margin: 22px 0 6px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .tip { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; }
      .tip b { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--cyan); font-size: 13px; flex-shrink: 0; }
      .tip p { margin: 0; color: var(--muted); font-size: 13px; } .tip p strong { color: var(--text); display: block; font-size: 13.5px; }
      .grp-title { margin: 28px 0 12px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
      .tile { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; transition: transform .2s, border-color .2s, box-shadow .2s; position: relative; overflow: hidden; }
      .tile:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: var(--shadow); }
      .tile .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, transparent), color-mix(in srgb, var(--accent2) 22%, transparent)); color: var(--cyan); }
      .tile h3 { font-size: 16px; } .tile p { margin: 0; color: var(--muted); font-size: 13px; flex: 1; }
      .badge { align-self: flex-start; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--panel3); color: var(--muted); }
      .badge.on { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
      .tile .badge-pos { position: absolute; top: 16px; right: 16px; }

      /* ---------- editor header ---------- */
      .ed-head { position: sticky; top: 0; z-index: 20; margin: 0 calc(-1 * clamp(16px, 3vw, 40px)); padding: 16px clamp(16px, 3vw, 40px) 14px; background: color-mix(in srgb, var(--bg) 90%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
      .ed-head-in { max-width: 880px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
      .ed-ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: var(--glow); }
      .ed-title { flex: 1; min-width: 180px; } .ed-title h1 { font-size: 24px; } .ed-title p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
      .ed-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .status { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; padding: 6px 11px; border-radius: 999px; background: var(--panel2); color: var(--muted); }
      .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
      .status.dirty { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); } .status.dirty i { background: var(--warn); animation: pulse 1.4s infinite; }
      @keyframes pulse { 50% { opacity: .35; } }
      .where { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--cyan); }
      .vis { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; font-size: 13px; }

      /* ---------- forms ---------- */
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-top: 16px; }
      .card > header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      .card > header h2 { font-size: 16px; flex: 1; } .card > header small { color: var(--muted); font-weight: 500; }
      .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
      .field { min-width: 0; } .field.wide { grid-column: 1 / -1; }
      .field > label { display: block; font-size: 12.5px; font-weight: 600; margin: 0 0 6px; color: var(--text); }
      .hint { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
      input[type=text], input[type=url], input[type=email], input[type=password], input[type=number], input:not([type]), textarea, select {
        width: 100%; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); font: inherit; transition: border-color .15s, box-shadow .15s; }
      html[data-theme="light"] input, html[data-theme="light"] textarea { background: #fbfbff; }
      input::placeholder, textarea::placeholder { color: var(--faint); }
      input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
      textarea { resize: vertical; min-height: 84px; line-height: 1.55; overflow: hidden; }
      .url-row { display: flex; gap: 6px; } .url-row input { flex: 1; }
      /* switch */
      .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; } .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
      .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--panel3); transition: background .2s; } .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
      .switch input:checked + span { background: linear-gradient(135deg, var(--accent), var(--accent2)); } .switch input:checked + span::after { transform: translateX(18px); }
      .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 14px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); }
      .toggle-row b { font-size: 13px; display: block; } .toggle-row small { color: var(--muted); font-size: 12px; }

      /* image widget */
      .imgw { display: flex; gap: 14px; align-items: stretch; flex-wrap: wrap; }
      .img-drop { position: relative; width: 190px; min-height: 120px; border-radius: 14px; border: 1.5px dashed var(--line2); background: var(--bg2) center/cover no-repeat; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 12px; cursor: pointer; overflow: hidden; transition: border-color .2s, background-color .2s; }
      .img-drop.has { border-style: solid; background-color: #fff; background-image: none; }
      .img-drop img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
      .img-drop.contain img { object-fit: contain; padding: 8px; }
      .img-drop:hover, .img-drop.over { border-color: var(--accent); background-color: color-mix(in srgb, var(--accent) 10%, var(--bg2)); }
      .img-drop .ph { padding: 12px; } .img-drop .ph svg { width: 26px; height: 26px; margin-bottom: 6px; color: var(--accent2); }
      .img-drop .busy { position: absolute; inset: 0; background: rgba(5,7,20,.7); display: none; place-items: center; color: #fff; font-weight: 600; z-index: 2; } .img-drop.loading .busy { display: grid; }
      .img-act { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
      .yt-prev { margin-top: 8px; display: flex; gap: 10px; align-items: center; } .yt-prev img { width: 120px; height: 68px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: #000; }
      .yt-prev span { color: var(--muted); font-size: 12px; }

      /* lists */
      .rows { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
      .row-item { display: flex; gap: 8px; align-items: flex-start; } .row-item > .num { width: 26px; height: 38px; display: grid; place-items: center; color: var(--faint); font-size: 12px; font-weight: 700; flex-shrink: 0; }
      .row-item > .inp { flex: 1; min-width: 0; } .row-item > .tools { display: flex; gap: 2px; padding-top: 3px; }
      .compact-head, .compact-row { display: grid; gap: 8px; align-items: center; }
      .compact-head { padding: 0 82px 6px 0; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
      .compact-row { grid-template-columns: var(--cols) auto; } .compact-row .tools { display: flex; gap: 2px; }
      .add-row { margin-top: 10px; }
      .empty { padding: 20px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line2); border-radius: 14px; font-size: 13px; }
      .items { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .item { background: var(--bg2); border: 1px solid var(--line); border-radius: 15px; transition: border-color .2s, box-shadow .2s; }
      .item.open { border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 8px 30px -16px rgba(99, 102, 241, .5); }
      .item-head { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; cursor: pointer; border-radius: 15px; user-select: none; }
      .item-head:hover { background: color-mix(in srgb, var(--panel2) 60%, transparent); }
      .item-num { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--panel3); color: var(--muted); font-size: 12px; font-weight: 700; flex-shrink: 0; }
      .item-thumb { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; background: #fff; border: 1px solid var(--line); flex-shrink: 0; }
      .item-thumb.empty { display: grid; place-items: center; background: var(--panel3); color: var(--faint); }
      .item-t { flex: 1; min-width: 0; } .item-t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .item-t small { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
      .item-tools { display: flex; gap: 2px; align-items: center; } .chev { transition: transform .25s; } .item.open .chev { transform: rotate(180deg); }
      .item-body { display: none; padding: 4px 16px 18px; border-top: 1px solid var(--line); } .item.open .item-body { display: block; animation: fadeDown .25s ease both; }
      .item-body .grid2 { margin-top: 14px; } .item-body .sub { margin-top: 18px; }
      .sub > h4 { margin: 0 0 8px; font-size: 12.5px; font-weight: 700; }
      @keyframes fadeDown { from { opacity: 0; transform: translateY(-6px); } }
      @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(99,102,241,.7); } 100% { box-shadow: 0 0 0 14px rgba(99,102,241,0); } }
      .item.flash { animation: flash .7s ease-out; }

      /* inbox */
      .msg { display: flex; gap: 14px; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; margin-top: 12px; }
      .avatar { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font: 700 17px "Space Grotesk", sans-serif; color: #fff; flex-shrink: 0; }
      .msg-body { flex: 1; min-width: 0; } .msg-top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; } .msg-top b { font-size: 15px; } .msg-top a { color: var(--cyan); text-decoration: none; font-size: 13px; } .msg-top time { margin-left: auto; color: var(--muted); font-size: 12px; }
      .msg p { margin: 8px 0 12px; white-space: pre-wrap; word-break: break-word; } .msg-act { display: flex; gap: 8px; }
      .blank { text-align: center; padding: 70px 20px; color: var(--muted); } .blank .big { width: 76px; height: 76px; border-radius: 24px; margin: 0 auto 16px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); color: var(--accent2); } .blank .big svg { width: 34px; height: 34px; }
      .blank h3 { color: var(--text); font-size: 18px; margin-bottom: 4px; }

      /* preview */
      #preview { display: none; width: min(46vw, 640px); flex-shrink: 0; position: sticky; top: 0; height: 100vh; border-left: 1px solid var(--line); background: var(--bg2); flex-direction: column; }
      #preview.open { display: flex; }
      .pv-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 600; } .pv-head span { flex: 1; }
      .pv-frame { flex: 1; position: relative; overflow: hidden; background: #05061a; } .pv-frame iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #05061a; }

      /* modal + toast */
      .modal { position: fixed; inset: 0; z-index: 90; background: rgba(3, 5, 20, .7); backdrop-filter: blur(6px); display: none; place-items: center; padding: 16px; } .modal.open { display: grid; animation: fadeIn .2s both; }
      @keyframes fadeIn { from { opacity: 0; } }
      .dlg { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line2); border-radius: 20px; padding: 24px; box-shadow: var(--shadow); animation: rise .3s cubic-bezier(.2,.8,.2,1) both; }
      .dlg h3 { font-size: 19px; } .dlg p { color: var(--muted); margin: 8px 0 20px; } .dlg .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
      .dlg.wide { width: min(740px, 100%); max-height: 96vh; overflow: auto; }

      /* ---------- save / reset ---------- */
      async function save() {

        const k = view.key; if (!isDirty()) return true;
        try {
          await api("/api/admin/section/" + k, {method: "PUT", body: JSON.stringify(CONTENT[k])});
          SNAP[k] = JSON.stringify(CONTENT[k]); SAVED[k] = true;
          if (window.__touch) window.__touch(); renderNav(); toast("Saved. Your site is updated."); if (previewOpen) openPreview(); return true;
        } catch (e) { toast(e.message, "err"); return false; }
      }
      async function resetSection() {
        const k = view.key; if (!(await confirmDlg("Reset this section?", "This brings back the original text and images for “" + (REG[k] ? REG[k].title : k) + "”. Your edits to it will be lost.", "Reset", true))) return;

          await api("/api/admin/section/" + k + "/reset", {method: "POST"});

        } catch (e) { toast(e.message, "err"); }
      }
      document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); } });

      /* ---------- live preview ---------- */

        const f = $("#pvIframe"), box = $("#pvFrame"); const W = 1440;
        const fit = () => { const s = box.clientWidth / W; f.style.width = W + "px"; f.style.height = box.clientHeight / s + "px"; f.style.transform = `scale(${s})`; };
        fit(); new ResizeObserver(fit).observe(box);
        const anchor = (REG[view.key] || {}).anchor || "home";
        f.onload = () => { let n = 0; const t = setInterval(() => { n++; try { const d = f.contentDocument; const el = d.getElementById(anchor); if (el && !d.querySelector(".loader")) { el.scrollIntoView({behavior: "auto"}); clearInterval(t); } } catch (_) { clearInterval(t); } if (n > 80) clearInterval(t); }, 250); };
        f.src = "/?preview=" + Date.now();

      $("#pvReload").append(ic("refresh", 16)); $("#pvClose").append(ic("x", 16));
      $("#pvReload").onclick = () => openPreview();
      $("#pvClose").onclick = () => { previewOpen = false; $("#preview").classList.remove("open"); };

      /* ---------- inbox ---------- */
      const hue = s => { let n = 0; for (const c of s) n = (n * 31 + c.charCodeAt(0)) % 360; return n; };
      const ago = ts => { const s = Math.max(1, Math.floor((Date.now() - ts) / 1000)); for (const [n, l] of [[31536000, "year"], [2592000, "month"], [86400, "day"], [3600, "hour"], [60, "minute"]]) if (s >= n) { const v = Math.floor(s / n); return v + " " + l + (v > 1 ? "s" : "") + " ago"; } return "just now"; };

      /* ---------- image cropper (pan + zoom, aspect presets) ---------- */
      const ASPECTS = [{label: "16:10 · card", a: 1.6}, {label: "16:9", a: 16 / 9}, {label: "4:3", a: 4 / 3}, {label: "5:4 · ID photo", a: 1.225}, {label: "1:1 · square", a: 1}, {label: "4:5 · portrait", a: 0.8}];

          const img = new Image();

            function paint(c, W, H, k) { c.fillStyle = bgEl.value; c.fillRect(0, 0, W, H); c.imageSmoothingQuality = "high"; c.drawImage(img, offX * k, offY * k, iw * scale * k, ih * scale * k); }
            function draw() { paint(ctx, cw, ch, 1); ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.lineWidth = 1; ctx.beginPath(); for (let i = 1; i < 3; i++) { ctx.moveTo(cw * i / 3, 0); ctx.lineTo(cw * i / 3, ch); ctx.moveTo(0, ch * i / 3); ctx.lineTo(cw, ch * i / 3); } ctx.stroke(); }
