<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio Admin</title>
    <style>
      :root {
        --bg: #0f172a; --panel: #1e293b; --panel2: #273449; --line: #334155;
        --text: #e2e8f0; --muted: #94a3b8; --accent: #6366f1; --accent2: #4f46e5;
        --danger: #ef4444; --ok: #22c55e; --radius: 10px;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg); color: var(--text); }
      button { cursor: pointer; font: inherit; border: none; border-radius: 8px; padding: 9px 14px; }
      .btn-primary { background: var(--accent); color: #fff; }
      .btn-primary:hover { background: var(--accent2); }
      .btn-ghost { background: var(--panel2); color: var(--text); }
      .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
      input, textarea, select { width: 100%; padding: 9px 11px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--panel2); color: var(--text); font: inherit; }
      textarea { min-height: 84px; resize: vertical; }
      label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 5px; text-transform: capitalize; }
      .field { margin-bottom: 14px; }

      /* Login */
      #login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
      #login .card { background: var(--panel); padding: 32px; border-radius: 14px; width: 340px;
        border: 1px solid var(--line); }
      #login h1 { margin: 0 0 6px; font-size: 20px; }
      #login p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }

      /* App */
      #app { display: none; grid-template-columns: 240px 1fr; min-height: 100vh; }
      aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; }
      aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
      .navbtn { display: block; width: 100%; text-align: left; background: transparent; color: var(--text);
        padding: 9px 11px; border-radius: 8px; margin-bottom: 2px; font-size: 14px; }
      .navbtn:hover { background: var(--panel2); }
      .navbtn.active { background: var(--accent); color: #fff; }
      main { padding: 26px 30px; max-width: 860px; }
      .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
      .topbar h1 { margin: 0; font-size: 22px; }
      .group { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; background: var(--panel); }
      .group > .group-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
      .group > .group-head .title { font-weight: 600; font-size: 13px; color: var(--muted); }
      .arr-item { border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; position: relative; background: var(--panel2); }
      .row { display: flex; gap: 8px; align-items: center; }
      .imgprev { max-height: 90px; border-radius: 6px; border: 1px solid var(--line); margin-top: 6px; display: block; }
      .toast { position: fixed; bottom: 22px; right: 22px; padding: 12px 18px; border-radius: 10px;
        background: var(--ok); color: #05240f; font-weight: 600; opacity: 0; transform: translateY(10px);
        transition: .25s; pointer-events: none; }
      .toast.show { opacity: 1; transform: translateY(0); }
      .toast.err { background: var(--danger); color: #fff; }
      .hint { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }
      .checkrow { display: flex; align-items: center; gap: 10px; }
      .checkrow input { width: auto; }
      .checkrow label { margin: 0; }
      /* Image cropper */
      #cropModal { position: fixed; inset: 0; z-index: 50; background: rgba(2,6,23,.8); display: none; place-items: center; padding: 16px; }
      #cropModal.open { display: grid; }
      #cropModal .cm { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: min(720px, 100%); max-height: 96vh; overflow: auto; }
      #cropModal h3 { margin: 0 0 4px; font-size: 17px; }
      #cropModal .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
      #cropModal .aspects { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
      #cropModal .aspects button { background: var(--panel2); color: var(--text); padding: 6px 12px; font-size: 13px; }
      #cropModal .aspects button.on { background: var(--accent); color: #fff; }
      #cropCanvas { width: 100%; display: block; border-radius: 8px; border: 1px solid var(--line); background: #000; cursor: grab; touch-action: none; }
      #cropCanvas.drag { cursor: grabbing; }
      #cropModal .ctrl { display: flex; gap: 16px; align-items: end; margin: 12px 0; flex-wrap: wrap; }
      #cropModal .ctrl > div { flex: 1; min-width: 160px; }
      #cropModal input[type=color] { padding: 2px; height: 38px; }
      #cropModal input[type=range] { padding: 0; }
    </style>
  </head>
  <body>
    <!-- LOGIN -->
    <div id="login">
      <div class="card">
        <h1>Portfolio Admin</h1>
        <p>Enter your admin password to manage your portfolio content.</p>
        <form id="loginForm">
          <div class="field">
            <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
          </div>
          <button class="btn-primary" style="width:100%" type="submit">Log in</button>
        </form>
      </div>
    </div>

    <!-- APP -->
    <div id="app">
      <aside>
        <h2>Sections</h2>
        <div id="nav"></div>
        <div style="margin-top:16px">
          <button class="btn-ghost" style="width:100%" id="logout">Log out</button>
        </div>
      </aside>
      <main>
        <div class="topbar">
          <h1 id="sectionTitle"></h1>
          <div class="row">
            <button class="btn-danger" id="resetBtn">Reset to default</button>
            <button class="btn-primary" id="saveBtn">Save changes</button>
          </div>
        </div>
        <div id="editor"></div>
      </main>
    </div>

    <!-- IMAGE CROPPER -->
    <div id="cropModal" role="dialog" aria-modal="true" aria-label="Crop image">
      <div class="cm">
        <h3>Crop image to fit</h3>
        <p class="sub">Drag the picture to reposition it, use the slider to zoom. The result is what visitors will see.</p>
        <div class="aspects" id="cropAspects"></div>
        <canvas id="cropCanvas"></canvas>
        <div class="ctrl">
          <div><label>Zoom</label><input type="range" id="cropZoom" min="0" max="100" value="0" /></div>
          <div style="max-width:150px"><label>Background (if image doesn't fill)</label><input type="color" id="cropBg" value="#0b0b0d" /></div>
        </div>
        <div class="row" style="justify-content:flex-end; flex-wrap:wrap">
          <button class="btn-ghost" id="cropCancel" type="button">Cancel</button>
          <button class="btn-ghost" id="cropOriginal" type="button">Use original (no crop)</button>
          <button class="btn-primary" id="cropApply" type="button">Apply crop</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const SECTION_LABELS = {
        heroSection: "Hero & Loader Text",
        badge: "3D ID Badge",
        musicSection: "Music / Spotify",
        commentsSection: "Guestbook Settings",
        greeting: "Greeting & Profile",
        aboutSection: "About Me",
        statsSection: "Impact Stats",
        splashScreen: "Splash / Lottie",
        socialMediaLinks: "Social Links",
        skillsSection: "Skills",
        workExperiences: "Work Experience",
        bigProjects: "Projects",
        openSource: "Open Source",
        achievementSection: "Certificates",
        honorsSection: "Awards & Videos",
        blogSection: "Blogs",
        linkedinRecommendations: "Recommendations",
        languagesSection: "Languages",
        resumeSection: "Resume",
        contactInfo: "Contact Me"
      };
      const IMAGE_KEY = /image|logo|avatar|photo|profileimage/i;
      const LONG_KEY = /desc|recommendation|subtitle|subTitle|projectDesc|bio/i;

      let content = {};
      let current = null;

      const $ = sel => document.querySelector(sel);
      function toast(msg, isErr) {
        const t = $("#toast");
        t.textContent = msg;
        t.className = "toast show" + (isErr ? " err" : "");
        setTimeout(() => (t.className = "toast"), 2200);
      }
      async function api(url, opts) {
        const res = await fetch(url, Object.assign({headers: {"Content-Type": "application/json"}}, opts));
        if (res.status === 401) { showLogin(); throw new Error("Not authenticated"); }
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Request failed");
        return res.status === 204 ? null : res.json();
      }

      function showLogin() { $("#app").style.display = "none"; $("#login").style.display = "grid"; }
      function showApp() { $("#login").style.display = "none"; $("#app").style.display = "grid"; }

      // ---- Login ----
      $("#loginForm").addEventListener("submit", async e => {
        e.preventDefault();
        try {
          await api("/api/login", {method: "POST", body: JSON.stringify({password: $("#password").value})});
          await boot();
        } catch (err) { toast(err.message, true); }
      });
      $("#logout").addEventListener("click", async () => {
        await api("/api/logout", {method: "POST"}).catch(() => {});
        showLogin();
      });

      // ---- Upload ----
      async function uploadFile(file, filename) {
        const fd = new FormData();
        fd.append("file", file, filename || file.name || "image.jpg");
        const res = await fetch("/api/admin/upload", {method: "POST", body: fd});
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Upload failed");
        return (await res.json()).url;
      }


      // ---- Image cropper -------------------------------------------------
      // openCropper(srcUrl) -> Promise<Blob | "original" | null>
      const ASPECTS = [
        {label: "16:10 · project card", a: 1.6},
        {label: "16:9", a: 16 / 9},
        {label: "4:3", a: 4 / 3},
        {label: "1:1 · square", a: 1},
        {label: "4:5 · portrait", a: 0.8}
      ];
      let lastAspect = 1.6;
      function openCropper(srcUrl) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            const modal = $("#cropModal"), canvas = $("#cropCanvas"), ctx = canvas.getContext("2d");
            const zoomEl = $("#cropZoom"), bgEl = $("#cropBg"), aspBox = $("#cropAspects");
            const iw = img.naturalWidth, ih = img.naturalHeight;
            let aspect = lastAspect, cw = 0, ch = 0, scale = 1, offX = 0, offY = 0, fit = 1, cover = 1, maxS = 1;

            function layout(keepCentre) {
              cw = 640; ch = Math.round(cw / aspect);
              if (ch > 460) { ch = 460; cw = Math.round(ch * aspect); }
              canvas.width = cw; canvas.height = ch;
              canvas.style.aspectRatio = cw + " / " + ch;
              canvas.style.maxWidth = cw + "px"; canvas.style.margin = "0 auto";
              fit = Math.min(cw / iw, ch / ih); cover = Math.max(cw / iw, ch / ih); maxS = cover * 4;
              if (!keepCentre) {
                scale = cover; offX = (cw - iw * scale) / 2; offY = (ch - ih * scale) / 2;
              }
              zoomEl.value = Math.round(((scale - fit) / (maxS - fit || 1)) * 100);
              clamp(); draw();
            }
            function clamp() {
              const w = iw * scale, h = ih * scale;
              offX = w >= cw ? Math.min(0, Math.max(cw - w, offX)) : Math.min(cw - w, Math.max(0, offX));
              offY = h >= ch ? Math.min(0, Math.max(ch - h, offY)) : Math.min(ch - h, Math.max(0, offY));
            }
            function paint(c, W, H, k) {
              c.fillStyle = bgEl.value; c.fillRect(0, 0, W, H);
              c.imageSmoothingQuality = "high";
              c.drawImage(img, offX * k, offY * k, iw * scale * k, ih * scale * k);
            }
            function draw() {
              paint(ctx, cw, ch, 1);
              ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.lineWidth = 1; ctx.beginPath();
              for (let i = 1; i < 3; i++) { ctx.moveTo(cw * i / 3, 0); ctx.lineTo(cw * i / 3, ch); ctx.moveTo(0, ch * i / 3); ctx.lineTo(cw, ch * i / 3); }
              ctx.stroke();
            }
            function setZoom(z) {
              const cx = cw / 2, cy = ch / 2;
              const rx = (cx - offX) / scale, ry = (cy - offY) / scale; // image point under the centre
              scale = fit + (maxS - fit) * (z / 100);
              offX = cx - rx * scale; offY = cy - ry * scale; clamp(); draw();
            }
            aspBox.innerHTML = "";
            ASPECTS.forEach(o => {
              const b = document.createElement("button"); b.type = "button"; b.textContent = o.label;
              if (Math.abs(o.a - aspect) < 0.01) b.className = "on";
              b.addEventListener("click", () => {
                aspect = o.a; lastAspect = o.a;
                [...aspBox.children].forEach(x => x.classList.remove("on")); b.classList.add("on");
                layout(false);
              });
              aspBox.appendChild(b);
            });

            // drag to pan (mouse + touch via pointer events)
            let drag = null;
            const down = e => { drag = {x: e.clientX, y: e.clientY, ox: offX, oy: offY}; canvas.classList.add("drag"); canvas.setPointerCapture(e.pointerId); };
            const move = e => {
              if (!drag) return;
              const r = canvas.getBoundingClientRect(), k = cw / r.width;
              offX = drag.ox + (e.clientX - drag.x) * k; offY = drag.oy + (e.clientY - drag.y) * k; clamp(); draw();
            };
            const up = () => { drag = null; canvas.classList.remove("drag"); };
            const wheel = e => { e.preventDefault(); const z = Math.max(0, Math.min(100, +zoomEl.value - Math.sign(e.deltaY) * 4)); zoomEl.value = z; setZoom(z); };
            const onZoom = () => setZoom(+zoomEl.value);
            const onBg = () => draw();
            canvas.addEventListener("pointerdown", down); canvas.addEventListener("pointermove", move);
            canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);
            canvas.addEventListener("wheel", wheel, {passive: false});
            zoomEl.addEventListener("input", onZoom); bgEl.addEventListener("input", onBg);

            function close(result) {
              modal.classList.remove("open");
              canvas.removeEventListener("pointerdown", down); canvas.removeEventListener("pointermove", move);
              canvas.removeEventListener("pointerup", up); canvas.removeEventListener("pointercancel", up);
              canvas.removeEventListener("wheel", wheel);
              zoomEl.removeEventListener("input", onZoom); bgEl.removeEventListener("input", onBg);
              $("#cropApply").onclick = $("#cropCancel").onclick = $("#cropOriginal").onclick = null;
              resolve(result);
            }
            $("#cropCancel").onclick = () => close(null);
            $("#cropOriginal").onclick = () => close("original");
            $("#cropApply").onclick = () => {
              const OW = 1280, OH = Math.round(OW / aspect), k = OW / cw;
              const out = document.createElement("canvas"); out.width = OW; out.height = OH;
              try {
                paint(out.getContext("2d"), OW, OH, k);
                out.toBlob(b => (b ? close(b) : (toast("Could not crop this image", true))), "image/jpeg", 0.92);
              } catch (err) { toast("Could not crop this image (" + err.message + ")", true); }
            };
            modal.classList.add("open");
            layout(false);
          };
          img.onerror = () => reject(new Error("Could not load the image to crop"));
          img.src = srcUrl;
        });
      }

      // ---- Recursive form builder ----
      // Renders `value` (obj[key]) into `parent`, binding edits back to obj[key].
      function buildField(parent, obj, key, value) {
        if (Array.isArray(value)) return buildArray(parent, obj, key, value);
        if (value !== null && typeof value === "object") return buildObject(parent, obj, key, value);
        return buildScalar(parent, obj, key, value);
      }

      function buildScalar(parent, obj, key, value) {
        const wrap = document.createElement("div");
        wrap.className = "field";

        if (typeof value === "boolean") {
          wrap.className = "field checkrow";
          const cb = document.createElement("input");
          cb.type = "checkbox"; cb.checked = value; cb.id = "cb_" + Math.random().toString(36).slice(2);
          cb.addEventListener("change", () => (obj[key] = cb.checked));
          const lbl = document.createElement("label"); lbl.textContent = key; lbl.htmlFor = cb.id;
          wrap.append(cb, lbl);
          parent.appendChild(wrap);
          return;
        }

        const lbl = document.createElement("label"); lbl.textContent = key;
        wrap.appendChild(lbl);

        // Image fields get an upload control, even when they start empty (null).
        const isImage = IMAGE_KEY.test(key) && (value === null || value === undefined || typeof value === "string");

        if (isImage) {
          const preview = document.createElement("img");
          preview.className = "imgprev";
          preview.style.display = value ? "block" : "none";
          if (value) preview.src = value;

          const row = document.createElement("div");
          row.className = "row"; row.style.marginTop = "6px";
          const file = document.createElement("input");
          file.type = "file"; file.accept = "image/*";

          const clear = document.createElement("button");
          clear.type = "button"; clear.className = "btn-ghost"; clear.textContent = "Remove";
          clear.style.display = value ? "inline-block" : "none";
          clear.addEventListener("click", () => {
            obj[key] = null;
            preview.style.display = "none"; clear.style.display = "none";
            file.value = "";
            toast("Image removed — Save to apply");
          });

          const applyUrl = url => {
            obj[key] = url;
            preview.src = url; preview.style.display = "block";
            clear.style.display = "inline-block"; recrop.style.display = "inline-block";
          };
          // re-crop the image that is already there
          const recrop = document.createElement("button");
          recrop.type = "button"; recrop.className = "btn-ghost"; recrop.textContent = "Crop / reposition";
          recrop.style.display = value ? "inline-block" : "none";
          recrop.addEventListener("click", async () => {
            try {
              const result = await openCropper(obj[key]);
              if (result && result !== "original") {
                applyUrl(await uploadFile(result, "cropped-" + Date.now() + ".jpg"));
                toast("Cropped image uploaded - Save to apply");
              }
            } catch (err) { toast(err.message, true); }
          });

          file.addEventListener("change", async () => {
            const f = file.files[0];
            if (!f) return;
            try {
              // offer a crop first (so the picture fits its frame), then upload
              const local = URL.createObjectURL(f);
              let toUpload = f, name = f.name;
              try {
                const result = await openCropper(local);
                if (result === null) { file.value = ""; URL.revokeObjectURL(local); return; }
                if (result !== "original") { toUpload = result; name = "cropped-" + Date.now() + ".jpg"; }
              } catch (_) { /* unsupported format for preview: upload as is */ }
              URL.revokeObjectURL(local);
              applyUrl(await uploadFile(toUpload, name));
              toast("Image uploaded");
            } catch (err) { toast(err.message, true); }
          });
          row.append(file, recrop, clear);
          wrap.appendChild(row);
          wrap.appendChild(preview);
          parent.appendChild(wrap);
          return;
        }

        const input = LONG_KEY.test(key) ? document.createElement("textarea") : document.createElement("input");
        input.value = value === null || value === undefined ? "" : value;
        input.addEventListener("input", () => (obj[key] = input.value));
        wrap.appendChild(input);
        parent.appendChild(wrap);
      }

      function buildObject(parent, obj, key, value) {
        const group = document.createElement("div");
        group.className = "group";
        const head = document.createElement("div");
        head.className = "group-head";
        head.innerHTML = '<span class="title">' + key + "</span>";
        group.appendChild(head);
        for (const k of Object.keys(value)) buildField(group, value, k, value[k]);
        parent.appendChild(group);
      }

      function templateFrom(arr) {
        // Build a blank item matching the shape of existing items (or a bare string).
        if (arr.length === 0) return "";
        const sample = arr[0];
        if (sample === null || typeof sample !== "object") return "";
        return blankLike(sample);
      }
      function blankLike(sample) {
        if (Array.isArray(sample)) return [];
        if (sample && typeof sample === "object") {
          const o = {};
          for (const k of Object.keys(sample)) o[k] = blankLike(sample[k]);
          return o;
        }
        if (typeof sample === "boolean") return false;
        if (typeof sample === "number") return 0;
        return "";
      }

      function buildArray(parent, obj, key, arr) {
        const group = document.createElement("div");
        group.className = "group";
        const head = document.createElement("div");
        head.className = "group-head";
        head.innerHTML = '<span class="title">' + key + " (" + arr.length + ")</span>";
        const addBtn = document.createElement("button");
        addBtn.className = "btn-ghost"; addBtn.textContent = "+ Add";
        head.appendChild(addBtn);
        group.appendChild(head);

        const list = document.createElement("div");
        group.appendChild(list);

        function renderItems() {
          list.innerHTML = "";
          arr.forEach((item, i) => {
            const card = document.createElement("div");
            card.className = "arr-item";
            const bar = document.createElement("div");
            bar.className = "row"; bar.style.justifyContent = "flex-end"; bar.style.marginBottom = "8px";
            const del = document.createElement("button");
            del.className = "btn-danger"; del.textContent = "Remove";
            del.addEventListener("click", () => { arr.splice(i, 1); renderItems(); head.querySelector(".title").textContent = key + " (" + arr.length + ")"; });
            bar.appendChild(del);
            card.appendChild(bar);
            if (item !== null && typeof item === "object") {
              for (const k of Object.keys(item)) buildField(card, item, k, item[k]);
            } else {
              // primitive array item — bind by index
              buildScalar(card, arr, i, item);
            }
            list.appendChild(card);
          });
        }
        addBtn.addEventListener("click", () => {
          arr.push(templateFrom(arr));
          renderItems();
          head.querySelector(".title").textContent = key + " (" + arr.length + ")";
        });
        renderItems();
        parent.appendChild(group);
      }

      // ---- Section rendering ----
      function renderNav() {
        const nav = $("#nav");
        nav.innerHTML = "";
        Object.keys(content).forEach(key => {
          const b = document.createElement("button");
          b.className = "navbtn" + (key === current ? " active" : "");
          b.textContent = SECTION_LABELS[key] || key;
          b.addEventListener("click", () => { current = key; renderNav(); renderSection(); });
          nav.appendChild(b);
        });
        // Messages inbox (contact form submissions)
        const msg = document.createElement("button");
        msg.className = "navbtn" + (current === "__messages" ? " active" : "");
        msg.textContent = "📬 Messages";
        msg.style.marginTop = "10px";
        msg.addEventListener("click", () => { current = "__messages"; renderNav(); renderMessages(); });
        nav.appendChild(msg);
        const cm = document.createElement("button");
        cm.className = "navbtn" + (current === "__comments" ? " active" : "");
        cm.textContent = "💬 Comments";
        cm.addEventListener("click", () => { current = "__comments"; renderNav(); renderComments(); });
        nav.appendChild(cm);
      }

      async function renderComments() {
        $("#sectionTitle").textContent = "Guestbook Comments";
        $("#saveBtn").style.display = "none";
        $("#resetBtn").style.display = "none";
        const editor = $("#editor");
        editor.innerHTML = "Loading…";
        let list = [];
        try { list = await api("/api/admin/comments"); }
        catch (err) { editor.innerHTML = ""; toast(err.message, true); return; }
        editor.innerHTML = "";
        if (!list.length) { editor.innerHTML = '<p class="hint">No comments yet.</p>'; return; }
        list.forEach(c => {
          const card = document.createElement("div");
          card.className = "group";
          const head = document.createElement("div");
          head.className = "group-head";
          head.innerHTML = '<span class="title">' + escapeHtml(c.name) + '</span><span class="title">' + new Date(c.created).toLocaleString() + "</span>";
          const body = document.createElement("p");
          body.style.whiteSpace = "pre-wrap"; body.style.margin = "0 0 10px"; body.textContent = c.comment;
          const del = document.createElement("button");
          del.className = "btn-danger"; del.textContent = "Delete";
          del.addEventListener("click", async () => {
            try { await api("/api/admin/comments/" + c.id, {method: "DELETE"}); renderComments(); }
            catch (err) { toast(err.message, true); }
          });
          card.append(head, body, del);
          editor.appendChild(card);
        });
      }

      async function renderMessages() {
        $("#sectionTitle").textContent = "Messages";
        $("#saveBtn").style.display = "none";
        $("#resetBtn").style.display = "none";
        const editor = $("#editor");
        editor.innerHTML = "Loading…";
        let msgs = [];
        try { msgs = await api("/api/admin/messages"); }
        catch (err) { editor.innerHTML = ""; toast(err.message, true); return; }
        editor.innerHTML = "";
        if (!msgs.length) {
          editor.innerHTML = '<p class="hint">No messages yet. Submissions from your site\'s contact form will appear here.</p>';
          return;
        }
        msgs.forEach(m => {
          const card = document.createElement("div");
          card.className = "group";
          const when = new Date(m.created).toLocaleString();
          const head = document.createElement("div");
          head.className = "group-head";
          head.innerHTML = '<span class="title">' + escapeHtml(m.name) +
            ' &lt;' + escapeHtml(m.email) + '&gt;</span><span class="title">' + when + "</span>";
          const body = document.createElement("p");
          body.style.whiteSpace = "pre-wrap";
          body.style.margin = "0 0 10px";
          body.textContent = m.message;
          const del = document.createElement("button");
          del.className = "btn-danger"; del.textContent = "Delete";
          del.addEventListener("click", async () => {
            try { await api("/api/admin/messages/" + m.id, {method: "DELETE"}); renderMessages(); }
            catch (err) { toast(err.message, true); }
          });
          card.append(head, body, del);
          editor.appendChild(card);
        });
      }
      function escapeHtml(s) {
        return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
      }
      function renderSection() {
        $("#saveBtn").style.display = "";
        $("#resetBtn").style.display = "";
        $("#sectionTitle").textContent = SECTION_LABELS[current] || current;
        const editor = $("#editor");
        editor.innerHTML = "";
        const data = content[current];
        for (const k of Object.keys(data)) buildField(editor, data, k, data[k]);
      }

      $("#saveBtn").addEventListener("click", async () => {
        try {
          await api("/api/admin/section/" + current, {method: "PUT", body: JSON.stringify(content[current])});
          toast("Saved — refresh your site to see changes");
        } catch (err) { toast(err.message, true); }
      });
      $("#resetBtn").addEventListener("click", async () => {
        if (!confirm("Reset this section to its default content?")) return;
        try {
          await api("/api/admin/section/" + current + "/reset", {method: "POST"});
          await loadContent();
          renderSection();
          toast("Reset to default");
        } catch (err) { toast(err.message, true); }
      });

      async function loadContent() {
        content = await api("/api/admin/content");
        if (!current || !content[current]) current = Object.keys(content)[0];
      }
      async function boot() {
        await loadContent();
        showApp();
        renderNav();
        renderSection();
      }

      // Auto-login if session cookie is still valid.
      (async () => {
        try { await api("/api/me"); await boot(); }
        catch (_) { showLogin(); }
      })();
    </script>
  </body>
</html>
